<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat</title>
    <link rel="stylesheet" href="/web/style.css">
</head>
<body>

    <form id="login">
        <h1>Who's<br>there?</h1>
        <input type="text" id="loginName" placeholder="Ник" maxlength="20" autocomplete="username">
        <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password">
        <select id="roomSelect">
            <option value="general">general</option>
            <option value="games">games</option>
        </select>
        <div class="login-buttons">
            <button type="button" id="loginBtn">Войти</button>
            <button type="button" id="registerBtn">Регистрация</button>
        </div>
        <p id="loginError" class="error"></p>
    </form>

    <main id="chat" hidden>
        <header class="chat-head">
            <div class="title">
                <h2>Chat</h2>
                <span id="roomName"></span>
                <span id="status" title="Connection"></span>
            </div>
            <button type="button" id="deleteBtn">Clear chat</button>
            <span id="onlineCount"></span>
        </header>

        <ul id="messages"></ul>

        <form id="send-msg">
            <input type="text" id="msgInput" placeholder="Message" autocomplete="off">
            <button id="sendBtn" type="submit">Send</button>
        </form>
    </main>

    <script src="/web/app.js"></script>
</body>
</html>
